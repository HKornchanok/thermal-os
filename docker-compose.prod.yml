# Production-shaped compose — meant for self-host / VPS demos. Real
# deployments push the backend image to Fly/Railway/Cloud Run and the
# frontend to Vercel; this file is for the case where you want one box.
#
# Required env (no defaults — fail loud):
#   DJANGO_SECRET_KEY     50+ random chars
#   ALLOWED_HOSTS         comma-separated host names (e.g. api.example.com)
#   NEXTAUTH_SECRET       openssl rand -base64 32
#   NEXTAUTH_URL          public URL of the frontend (https://...)
#   POSTGRES_PASSWORD     non-default DB password
#   CORS_ALLOWED_ORIGINS  comma-separated FE origins (https://...)
#
# Optional:
#   ANTHROPIC_API_KEY     enables /api/chat/, otherwise graceful fallback
#   GUNICORN_WORKERS      default 3
#
# Usage:
#   cp .env.prod.example .env.prod && edit
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  db:
    image: timescale/timescaledb:latest-pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thermalos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-thermalos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thermalos} -d ${POSTGRES_DB:-thermalos}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-thermalos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-thermalos}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DEBUG: "false"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      # Frontend is the only public surface; /api/* is proxied to backend
      # via Next rewrites so the backend container has no published port.
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
