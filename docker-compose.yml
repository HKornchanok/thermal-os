services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: thermalos
      POSTGRES_PASSWORD: thermalos
      POSTGRES_DB: thermalos
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermalos -d thermalos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://thermalos:thermalos@db:5432/thermalos
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-me}
      DEBUG: "true"
      ALLOWED_HOSTS: "*"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
